<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0ea5e9" />
      <stop offset="50%" stopColor="#2563eb" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#38bdf8" />
      <stop offset="100%" stopColor="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Outer biometric shield contour -->
  <path d="M32 4 L54 12 C54 36 44 52 32 60 C20 52 10 36 10 12 Z" fill="#0b1120" stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" />

  <!-- 16x16 patch scan grid overlay (inner representation) -->
  <rect x="20" y="16" width="24" height="24" rx="4" fill="#030712" stroke="#1e293b" stroke-width="1" />
  <line x1="26" y1="16" x2="26" y2="40" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.3" />
  <line x1="32" y1="16" x2="32" y2="40" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.5" />
  <line x1="38" y1="16" x2="38" y2="40" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.3" />
  <line x1="20" y1="22" x2="44" y2="22" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.3" />
  <line x1="20" y1="28" x2="44" y2="28" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.5" />
  <line x1="20" y1="34" x2="44" y2="34" stroke="#0ea5e9" stroke-width="0.75" stroke-opacity="0.3" />

  <!-- Facial geometry nodes -->
  <circle cx="26" cy="24" r="1.75" fill="#38bdf8" />
  <circle cx="38" cy="24" r="1.75" fill="#38bdf8" />
  <path d="M32 26 L32 31 L30 32 L34 32" stroke="#38bdf8" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M28 35 Q32 37 36 35" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round" fill="none" />

  <!-- Active scan line -->
  <line x1="16" y1="28" x2="48" y2="28" stroke="url(#glowGrad)" stroke-width="1.5" stroke-linecap="round" />

  <!-- Cryptographic check node at bottom -->
  <circle cx="32" cy="48" r="3" fill="#0284c7" stroke="#38bdf8" stroke-width="1" />
</svg>